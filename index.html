<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora eBird · Rápida</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<!-- SDKs de Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#121816;
    --panel:#1B2421;
    --panel-hover:#24302C;
    --text:#E2E8E4;
    --muted:#94A39B;
    --accent:#2DD4BF;
    --accent-dark:#0D9488;
    --danger:#F43F5E;
    --warning:#F59E0B;
    --border:#2A3833;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;}
  
  /* Pantalla de Login ultrarrápida */
  #authScreen{
    position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);
    display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;
  }
  .auth-card{
    background:var(--panel);border:1px solid var(--border);padding:24px;border-radius:8px;
    width:100%;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .auth-card h2{margin-top:0;font-size:20px;color:var(--accent);letter-spacing:0.5px;}
  .auth-card label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px 0;}
  .auth-card input{
    width:100%;padding:10px;background:#111614;border:1px solid var(--border);color:var(--text);
    border-radius:4px;font-size:14px;
  }
  .auth-card input:focus{outline:none;border-color:var(--accent);}
  .auth-card button{
    width:100%;padding:11px;background:var(--accent);color:#111;border:none;border-radius:4px;
    font-weight:700;cursor:pointer;margin-top:14px;font-size:14px;
  }
  .auth-card button:hover{background:var(--accent-dark);color:#fff;}
  .auth-switch{text-align:center;font-size:12px;color:var(--muted);margin-top:14px;cursor:pointer;}
  .auth-switch:hover{color:var(--accent);text-decoration:underline;}

  /* App Principal Compacta */
  #appContainer{display:none;flex-direction:column;min-height:100vh;}

  header.masthead{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);
    flex-wrap:wrap;gap:10px;
  }
  header.masthead h1{font-size:17px;margin:0;font-weight:700;color:var(--accent);}
  header.masthead .user-info{font-size:12px;color:var(--muted);}
  header.masthead .actions-top{display:flex;gap:8px;align-items:center;}
  button.btn-sm{
    background:#24302C;color:var(--text);border:1px solid var(--border);
    padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;
  }
  button.btn-sm:hover{background:var(--panel-hover);border-color:var(--accent);}
  button.btn-danger{background:#3A1D23;color:var(--danger);border-color:#592530;}

  /* Barra de Control Rápido Horizontal */
  .quick-bar{
    background:#161D1B;padding:12px 20px;border-bottom:1px solid var(--border);
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  }
  .control-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:140px;}
  .control-group label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
  .control-group select, .control-group input[type="text"], .control-group input[type="number"]{
    background:#111614;border:1px solid var(--border);color:var(--text);padding:7px 10px;
    border-radius:4px;font-size:13px;width:100%;
  }
  .control-group select:focus, input:focus{outline:none;border-color:var(--accent);}

  .checkbox-group{display:flex;align-items:center;gap:6px;margin-top:4px;}
  .checkbox-group input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
  .checkbox-group label{font-size:12px;color:var(--text);cursor:pointer;}

  /* Layout Principal (Mapa + Feed) */
  .workspace{display:flex;flex:1;min-height:calc(100vh - 120px);}
  aside.sidebar{
    width:380px;flex:none;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;height:calc(100vh - 120px);position:sticky;top:0;
  }
  .sidebar-header{
    padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;
  }
  .view-tabs{display:flex;gap:4px;}
  .view-tabs button{
    background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 14px;
    border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;
  }
  .view-tabs button.active{background:var(--accent);color:#111;border-color:var(--accent);}

  .feed-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
  
  #map-container{flex:1;position:relative;background:#0A0E0C;}
  #map{width:100%;height:100%;min-height:400px;}

  /* Tarjetas de Avistamiento Optimizadas */
  .card{
    background:#161D1B;border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;
    transition:border-color 0.2s;
  }
  .card:hover{border-color:var(--accent);}
  .card.notable{border-left-color:var(--warning);}
  .card.unconfirmed{border-left-color:var(--danger);}
  
  .card-top{display:flex;gap:10px;align-items:flex-start;}
  .card-thumb{width:50px;height:50px;border-radius:4px;background:#111614;flex:none;overflow:hidden;border:1px solid var(--border);}
  .card-thumb img{width:100%;height:100%;object-fit:cover;}
  .card-thumb.empty::after{content:'\1F426';display:flex;align-items:center;justify-content:center;height:100%;font-size:20px;opacity:0.3;}
  
  .card-info{flex:1;min-width:0;}
  .card-title{font-size:14px;font-weight:700;margin:0 0 2px 0;color:#fff;}
  .card-sci{font-size:11.5px;color:var(--muted);font-style:italic;margin:0;}
  
  .badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:4px;vertical-align:middle;}
  .badge.new{background:var(--danger);color:#fff;}
  .badge.seen{background:#24302C;color:var(--muted);}
  
  .card-meta{font-size:11.5px;color:var(--muted);line-height:1.4;}
  .card-comment{font-size:11.5px;background:#111614;padding:6px 8px;border-radius:4px;border-left:2px solid var(--border);color:#C2CDC7;margin-top:4px;}
  
  .card-actions{display:flex;gap:6px;margin-top:2px;}
  .card-actions a{
    flex:1;text-align:center;background:#24302C;color:var(--text);text-decoration:none;
    padding:5px;border-radius:3px;font-size:11.5px;font-weight:600;border:1px solid var(--border);
  }
  .card-actions a.wa{background:#064E3B;color:#6EE7B7;border-color:#065F46;}
  .card-actions a:hover{opacity:0.85;}

  .status-text{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;text-align:right;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

  @media (max-width:850px){
    .workspace{flex-direction:column;}
    aside.sidebar{width:100%;height:50vh;position:relative;}
    #map-container{height:50vh;}
  }
</style>
</head>
<body>

<!-- Login Rápido -->
<div id="authScreen">
  <div class="auth-card">
    <h2 id="authTitle">Acceso Bitácora</h2>
    <div id="authError" style="color:var(--danger);font-size:12px;margin-bottom:8px;"></div>
    <label>Correo</label>
    <input type="email" id="authEmail" placeholder="usuario@correo.com">
    <label>Contraseña</label>
    <input type="password" id="authPassword" placeholder="••••••••">
    <button id="authBtn">Ingresar</button>
    <div class="auth-switch" id="authSwitchMode">¿No tienes cuenta? Regístrate</div>
  </div>
</div>

<!-- Aplicación Principal -->
<div id="appContainer">
  <header class="masthead">
    <div>
      <h1>Bitácora eBird</h1>
      <div class="user-info">Conectado como: <span id="userEmailSpan" style="color:var(--accent);"></span></div>
    </div>
    <div class="actions-top">
      <div class="status-text">
        <span id="lastUpdate">Sin datos</span>
        <span id="nextUpdate" style="font-size:10px;"></span>
      </div>
      <button class="btn-sm" id="btnRefresh">Actualizar</button>
      <button class="btn-sm btn-danger" id="btnLogout">Salir</button>
    </div>
  </header>

  <!-- Barra de Configuración Horizontal Rápida -->
  <div class="quick-bar">
    <div class="control-group" style="max-width:180px;">
      <label>Zona</label>
      <select id="region">
        <option value="CL">Todo Chile</option>
        <option value="CL-AP">Arica y Parinacota</option>
        <option value="CL-TA">Tarapacá</option>
        <option value="CL-AN">Antofagasta</option>
        <option value="CL-AT">Atacama</option>
        <option value="CL-CO">Coquimbo</option>
        <option value="CL-VS">Valparaíso</option>
        <option value="CL-RM">Metropolitana</option>
        <option value="CL-LI">O'Higgins</option>
        <option value="CL-ML">Maule</option>
        <option value="CL-NB">Ñuble</option>
        <option value="CL-BI">Biobío</option>
        <option value="CL-AR">Araucanía</option>
        <option value="CL-LR">Los Ríos</option>
        <option value="CL-LL">Los Lagos</option>
        <option value="CL-AI">Aysén</option>
        <option value="CL-MA">Magallanes</option>
      </select>
    </div>

    <div class="control-group" style="max-width:150px;">
      <label>Filtro</label>
      <select id="mode">
        <option value="notable">Solo Raras</option>
        <option value="all">Todas</option>
      </select>
    </div>

    <div class="control-group" style="max-width:90px;">
      <label>Días atrás</label>
      <input type="number" id="backDays" min="1" max="14" value="2">
    </div>

    <div class="control-group" style="max-width:110px;">
      <label>Nombres</label>
      <select id="nameLocale">
        <option value="es-CL">Español (CL)</option>
        <option value="es">Español</option>
        <option value="en">Inglés</option>
        <option value="sci">Científico</option>
      </select>
    </div>

    <div class="control-group" style="flex:2;min-width:200px;">
      <label>Lista CSV (Vitalicia)</label>
      <input type="file" id="lifeListFile" accept=".csv" style="font-size:11.5px;padding:4px;">
    </div>

    <div class="control-group" style="max-width:160px;">
      <label>WhatsApp Compañero</label>
      <input type="text" id="friendPhone" placeholder="Ej: 56912345678">
    </div>

    <div style="display:flex;flex-direction:column;gap:4px;">
      <div class="checkbox-group">
        <input type="checkbox" id="hideSeenToggle">
        <label for="hideSeenToggle">Ocultar vistas</label>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="includeProvisional">
        <label for="includeProvisional">En revisión</label>
      </div>
    </div>

    <button class="btn-sm" id="btnSave" style="background:var(--accent);color:#111;font-weight:700;padding:8px 16px;margin-top:auto;">Aplicar</button>
  </div>

  <!-- Workspace con Sidebar Feed y Mapa -->
  <div class="workspace">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span id="lifeStatus" style="font-size:11.5px;color:var(--muted);">Cargando...</span>
        <div class="view-tabs">
          <button id="tabFeed" class="active">Lista</button>
          <button id="tabMapToggle">Mapa</button>
        </div>
      </div>
      <div id="feed" class="feed-list"></div>
    </aside>

    <div id="map-container">
      <div id="map"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  'use strict';

  var firebaseConfig = {
    apiKey: "AIzaSyBRs59_2hhEyyFGuZ6jn2XgQS1Ve74Awrg",
    authDomain: "ebird-c1352.firebaseapp.com",
    projectId: "ebird-c1352",
    storageBucket: "ebird-c1352.appspot.com",
    messagingSenderId: "119395490083",
    appId: "1:119395490083:web:3ecf01bef253ed56cf5496"
  };

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var EMBEDDED_API_KEY = '89f4bf7f-47ac-4e68-949f-de69c890bce7';
  var currentUser = null;
  
  // Carga instantánea de estado desde caché local si existe
  var cachedState = localStorage.getItem('ebird_fast_state');
  var state = cachedState ? JSON.parse(cachedState) : {
    apiKey: EMBEDDED_API_KEY, region:'CL', mode:'notable', backDays:2, interval:10,
    friendPhone:'', lifeList:[], hideSeen:false, nameLocale:'es-CL', includeProvisional:false, seenSubIds:[]
  };

  var map, markerLayer;
  var pollTimer = null, countdownTimer = null, nextRunAt = null;
  var lastObservations = [];

  // Auth logic optimizada
  var isRegistering = false;
  document.getElementById('authSwitchMode').addEventListener('click', function(){
    isRegistering = !isRegistering;
    document.getElementById('authTitle').textContent = isRegistering ? 'Crear Cuenta' : 'Acceso Bitácora';
    document.getElementById('authBtn').textContent = isRegistering ? 'Registrarse' : 'Ingresar';
    document.getElementById('authSwitchMode').textContent = isRegistering ? '¿Ya tienes cuenta? Ingresa' : '¿No tienes cuenta? Regístrate';
  });

  document.getElementById('authBtn').addEventListener('click', function(){
    var email = document.getElementById('authEmail').value.trim();
    var pass = document.getElementById('authPassword').value.trim();
    var errBox = document.getElementById('authError');
    errBox.textContent = '';
    if(!email || !pass){ errBox.textContent = 'Completa los campos.'; return; }
    if(isRegistering){
      auth.createUserWithEmailAndPassword(email, pass).catch(function(e){ errBox.textContent = e.message; });
    } else {
      auth.signInWithEmailAndPassword(email, pass).catch(function(e){ errBox.textContent = e.message; });
    }
  });

  document.getElementById('btnLogout').addEventListener('click', function(){
    auth.signOut().then(function(){
      localStorage.removeItem('ebird_fast_state');
      location.reload();
    });
  });

  auth.onAuthStateChanged(function(user){
    if(user){
      currentUser = user;
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('appContainer').style.display = 'flex';
      document.getElementById('userEmailSpan').textContent = user.email;
      
      // Renderizar UI de inmediato con lo que haya
      fillForm();
      renderLifeStatus();
      initMap();
      fetchObservations(false);

      // Sincronizar datos de Firestore en segundo plano (sin bloquear)
      db.collection('users').doc(currentUser.uid).get().then(function(doc){
        if(doc.exists){
          var data = doc.data();
          if(data.preferences) Object.assign(state, data.preferences);
          if(data.lifeList) state.lifeList = data.lifeList;
          localStorage.setItem('ebird_fast_state', JSON.stringify(state));
          fillForm();
          renderLifeStatus();
          renderCurrentData();
        }
      }).catch(function(){});
    } else {
      currentUser = null;
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('appContainer').style.display = 'none';
    }
  });

  function saveUserDataToCloud(){
    localStorage.setItem('ebird_fast_state', JSON.stringify(state));
    if(!currentUser) return;
    db.collection('users').doc(currentUser.uid).set({
      preferences: {
        region: state.region, mode: state.mode, backDays: state.backDays,
        interval: state.interval, friendPhone: state.friendPhone,
        hideSeen: state.hideSeen, nameLocale: state.nameLocale, includeProvisional: state.includeProvisional
      },
      lifeList: state.lifeList
    }, {merge: true});
  }

  function parseCSV(text){
    var lines = text.split(/\r\n|\n|\r/).filter(function(l){return l.trim().length;});
    if(!lines.length) return [];
    var headers = splitCSVLine(lines[0]).map(function(h){return h.trim().toLowerCase();});
    var sciIdx = headers.findIndex(function(h){return h.indexOf('scientific')>-1;});
    var comIdx = headers.findIndex(function(h){return h.indexOf('common name')>-1 || h==='species';});
    var seen = {};
    for(var i=1;i<lines.length;i++){
      var cols = splitCSVLine(lines[i]);
      var sci = sciIdx>-1 ? (cols[sciIdx]||'').trim().toLowerCase() : '';
      var com = comIdx>-1 ? (cols[comIdx]||'').trim() : '';
      var key = sci || normalizeText(com);
      if(!key) continue;
      if(!seen[key]) seen[key] = {sci: sci, common: normalizeText(com)};
    }
    var result = [];
    for(var k in seen){ result.push(seen[k]); }
    return result;
  }

  function splitCSVLine(line){
    var out = [], cur = '', inQuotes = false;
    for(var i=0;i<line.length;i++){
      var ch = line[i];
      if(ch === '"'){ inQuotes = !inQuotes; continue; }
      if(ch === ',' && !inQuotes){ out.push(cur); cur=''; continue; }
      cur += ch;
    }
    out.push(cur);
    return out;
  }
  function normalizeText(t){
    return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  }
  function isInLifeList(obs){
    if(!state.lifeList.length) return false;
    var sci = (obs.sciName||'').toLowerCase();
    var com = normalizeText(obs.comName||'');
    return state.lifeList.some(function(item){
      return (item.sci && sci && item.sci === sci) || (item.common && com && item.common === com);
    });
  }

  document.getElementById('lifeListFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      state.lifeList = parseCSV(ev.target.result);
      saveUserDataToCloud();
      renderLifeStatus();
      lastObservations.forEach(function(obs){ obs._inLifeList = isInLifeList(obs); });
      renderCurrentData();
    };
    reader.readAsText(file);
  });

  function fillForm(){
    document.getElementById('region').value = state.region || 'CL';
    document.getElementById('mode').value = state.mode || 'notable';
    document.getElementById('includeProvisional').checked = !!state.includeProvisional;
    document.getElementById('nameLocale').value = state.nameLocale || 'es-CL';
    document.getElementById('backDays').value = state.backDays || 2;
    document.getElementById('friendPhone').value = state.friendPhone || '';
    document.getElementById('hideSeenToggle').checked = !!state.hideSeen;
  }

  function readForm(){
    state.region = document.getElementById('region').value;
    state.mode = document.getElementById('mode').value;
    state.includeProvisional = document.getElementById('includeProvisional').checked;
    state.nameLocale = document.getElementById('nameLocale').value;
    state.backDays = Math.min(14, Math.max(1, parseInt(document.getElementById('backDays').value,10) || 2));
    state.friendPhone = document.getElementById('friendPhone').value.trim().replace(/[^0-9]/g,'');
    state.hideSeen = document.getElementById('hideSeenToggle').checked;
    saveUserDataToCloud();
  }

  function renderLifeStatus(){
    var box = document.getElementById('lifeStatus');
    if(state.lifeList && state.lifeList.length){
      box.innerHTML = 'Lista Nube: <b>'+state.lifeList.length+' spp</b>';
    } else {
      box.textContent = 'Sin lista CSV cargada.';
    }
  }

  function initMap(){
    if(map) return;
    map = L.map('map', {zoomControl:false}).setView([-33.45,-70.66], 5);
    L.control.zoom({position: 'bottomright'}).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: '&copy; OSM'
    }).addTo(map);
    markerLayer = L.layerGroup().addTo(map);
  }

  function buildUrl(){
    var base = 'https://api.ebird.org/v2/data/obs/' + encodeURIComponent(state.region) + '/recent';
    if(state.mode === 'notable') base += '/notable';
    var nameLocale = (state.nameLocale === 'sci') ? 'es-CL' : state.nameLocale;
    var params = ['back='+state.backDays, 'sppLocale='+nameLocale, 'detail=full', 'key='+encodeURIComponent(state.apiKey)];
    if(state.mode === 'all') params.push('maxResults=300');
    if(state.includeProvisional) params.push('includeProvisional=true');
    return base + '?' + params.join('&');
  }

  function fetchObservations(manual){
    var directUrl = buildUrl();
    document.getElementById('lastUpdate').textContent = 'Buscando...';
    fetch(directUrl)
      .then(function(res){ if(!res.ok) throw new Error(); return res.json(); })
      .then(function(data){ handleNewData(data); })
      .catch(function(){
        fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(directUrl))
          .then(function(res){ return res.json(); })
          .then(function(data){ handleNewData(data); })
          .catch(function(){ document.getElementById('lastUpdate').textContent = 'Error red'; });
      })
      .finally(function(){ scheduleNext(); });
  }

  function handleNewData(data){
    var seenSet = {};
    state.seenSubIds.forEach(function(id){ seenSet[id]=true; });
    data.forEach(function(obs){
      obs._isNew = !seenSet[obs.subId];
      obs._inLifeList = isInLifeList(obs);
      obs._unconfirmed = (obs.obsValid === false);
    });
    data.sort(function(a,b){ return new Date(b.obsDt) - new Date(a.obsDt); });
    data.forEach(function(obs){ seenSet[obs.subId]=true; });
    state.seenSubIds = Object.keys(seenSet);

    lastObservations = data;
    document.getElementById('lastUpdate').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'});
    renderCurrentData();
  }

  function scheduleNext(){
    clearTimeout(pollTimer);
    clearInterval(countdownTimer);
    var ms = 10 * 60 * 1000;
    nextRunAt = Date.now()+ms;
    pollTimer = setTimeout(function(){ fetchObservations(false); }, ms);
    countdownTimer = setInterval(updateCountdown, 1000);
  }
  function updateCountdown(){
    var remaining = Math.max(0, Math.round((nextRunAt-Date.now())/1000));
    var m = Math.floor(remaining/60), s = remaining%60;
    document.getElementById('nextUpdate').textContent = 'Prox: ' + m + ':' + (s<10?'0':'')+s;
  }

  function renderCurrentData(){
    var dataToRender = lastObservations;
    if(state.hideSeen && state.lifeList.length > 0){
      dataToRender = lastObservations.filter(function(obs){ return !obs._inLifeList; });
    }
    renderMapMarkers(dataToRender);
    renderFeed(dataToRender);
  }

  function renderMapMarkers(data){
    if(!markerLayer) return;
    markerLayer.clearLayers();
    if(!data.length) return;
    var bounds = [];
    data.forEach(function(obs){
      if(typeof obs.lat !== 'number' || typeof obs.lng !== 'number') return;
      var color = obs._unconfirmed ? '#F59E0B' : (obs._inLifeList===false && state.lifeList.length ? '#F43F5E' : '#2DD4BF');
      var marker = L.circleMarker([obs.lat,obs.lng], { radius: 6, color: color, fillColor: color, fillOpacity: 0.9, weight: 1 });
      marker.bindPopup(popupHtml(obs));
      marker.addTo(markerLayer);
      bounds.push([obs.lat,obs.lng]);
    });
    if(bounds.length) map.fitBounds(bounds, {padding:[20,20], maxZoom:11});
  }

  function popupHtml(obs){
    var observer = escapeHtml(obs.userDisplayName || (obs.firstName ? obs.firstName + ' ' + obs.lastName : 'Ebirder'));
    return '<div style="font-size:13px;color:#111;"><b>'+escapeHtml(primaryName(obs))+'</b><br>'+
      '<span style="font-style:italic;color:#555;">'+escapeHtml(secondaryLine(obs))+'</span><br>'+
      '📍 '+escapeHtml(obs.locName)+'<br>👤 '+observer+'</div>'+
      '<a href="'+whatsappLink(obs)+'" target="_blank" rel="noopener" style="display:block;margin-top:6px;background:#064E3B;color:#6EE7B7;text-align:center;padding:4px;border-radius:3px;text-decoration:none;font-weight:700;font-size:11px;">WhatsApp</a>';
  }

  function renderFeed(data){
    var feed = document.getElementById('feed');
    if(!data.length){ feed.innerHTML = '<div class="empty-state">No hay registros con estos filtros.</div>'; return; }
    feed.innerHTML = data.map(cardHtml).join('');
  }

  function cardHtml(obs){
    var classes = 'card' + (state.mode==='notable' ? ' notable' : '') + (obs._unconfirmed ? ' unconfirmed' : '');
    var newBadge = obs._isNew ? '<span class="badge new">Nuevo</span>' : '';
    var lifeBadge = (state.lifeList.length && !obs._inLifeList) ? '<span class="badge new">¡Falta!</span>' : '';
    var unconfirmedBadge = obs._unconfirmed ? '<span class="badge" style="background:#451A03;color:#F59E0B;">Revisión</span>' : '';
    var observer = escapeHtml(obs.userDisplayName || (obs.firstName ? obs.firstName + ' ' + obs.lastName : 'Ebirder'));
    var commentText = obs.comments || obs.subIDComments || '';
    var commentsHtml = commentText ? '<div class="card-comment">💬 "'+escapeHtml(commentText)+'"</div>' : '';

    return '<div class="'+classes+'">'+
      '<div class="card-top">'+
        '<div class="card-thumb empty"></div>'+
        '<div class="card-info">'+
          '<p class="card-title">'+escapeHtml(primaryName(obs))+' '+newBadge+' '+lifeBadge+' '+unconfirmedBadge+'</p>'+
          '<p class="card-sci">'+escapeHtml(secondaryLine(obs))+'</p>'+
          '<div class="card-meta">📍 '+escapeHtml(obs.locName)+'<br>🕒 '+formatDate(obs.obsDt)+(obs.howMany ? ' · '+obs.howMany+' ind.' : '')+'<br>👤 '+observer+'</div>'+
        '</div>'+
      '</div>'+
      commentsHtml+
      '<div class="card-actions">'+
        '<a class="wa" href="'+whatsappLink(obs)+'" target="_blank" rel="noopener">WhatsApp</a>'+
        '<a href="https://www.google.com/maps?q='+obs.lat+','+obs.lng+'" target="_blank" rel="noopener">Mapa</a>'+
        '<a href="https://ebird.org/checklist/'+obs.subId+'" target="_blank" rel="noopener">eBird</a>'+
      '</div>'+
    '</div>';
  }

  function whatsappLink(obs){
    var nameLine = (state.nameLocale === 'sci') ? primaryName(obs) : (primaryName(obs)+' ('+obs.sciName+')');
    var observer = obs.userDisplayName || (obs.firstName ? obs.firstName + ' ' + obs.lastName : 'Ebirder');
    var commentText = obs.comments || obs.subIDComments || '';
    var msg = '🐦 '+nameLine+'\n'+
      (obs._unconfirmed ? '⚠️ Rareza en revisión\n' : '')+
      '📍 '+obs.locName+'\n'+
      '🕒 '+formatDate(obs.obsDt)+
      (obs.howMany ? '\n🔢 '+obs.howMany+' ejemplar(es)' : '')+
      '\n👤 '+observer+
      (commentText ? '\n💬 "'+commentText+'"' : '')+
      '\n🗺️ https://www.google.com/maps?q='+obs.lat+','+obs.lng+
      '\n📋 https://ebird.org/checklist/'+obs.subId;
    return state.friendPhone ? 'https://wa.me/'+state.friendPhone+'?text='+encodeURIComponent(msg) : 'https://wa.me/?text='+encodeURIComponent(msg);
  }

  function formatDate(d){
    var dt = new Date(d.replace(' ','T'));
    if(isNaN(dt.getTime())) return d;
    return dt.toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'});
  }

  function primaryName(obs){ return state.nameLocale === 'sci' ? obs.sciName : obs.comName; }
  function secondaryLine(obs){ return state.nameLocale === 'sci' ? obs.comName : obs.sciName; }
  function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Tabs móvil / responsive toggle
  var activeTab = 'feed';
  document.getElementById('tabFeed').addEventListener('click', function(){
    activeTab = 'feed';
    document.getElementById('tabFeed').classList.add('active');
    document.getElementById('tabMapToggle').classList.remove('active');
    document.querySelector('.sidebar').style.display = 'flex';
    document.getElementById('map-container').style.display = 'none';
  });
  document.getElementById('tabMapToggle').addEventListener('click', function(){
    activeTab = 'map';
    document.getElementById('tabMapToggle').classList.add('active');
    document.getElementById('tabFeed').classList.remove('active');
    if(window.innerWidth <= 850){
      document.querySelector('.sidebar').style.display = 'none';
      document.getElementById('map-container').style.display = 'block';
    }
    if(map) map.invalidateSize();
  });

  document.getElementById('btnRefresh').addEventListener('click', function(){ fetchObservations(true); });
  document.getElementById('btnSave').addEventListener('click', function(){
    readForm();
    fetchObservations(true);
  });

  if(window.innerWidth <= 850){
    document.getElementById('map-container').style.display = 'none';
  }

})();
</script>
</body>
</html>
