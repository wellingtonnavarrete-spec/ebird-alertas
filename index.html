<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora eBird · Chile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<!-- SDKs de Firebase -->
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --ink:#16231F;
    --paper:#E9ECE4;
    --paper-2:#F4F5EF;
    --moss:#45614A;
    --teal:#1F6F64;
    --teal-dark:#164F47;
    --flame:#C94A3D;
    --amber:#B8860B;
    --line:#C9CBB8;
    --muted:#5B6A5D;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
  }

  /* Pantalla de Login */
  #authScreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:20px;
  }

  .auth-card{
    background:var(--paper-2);
    border:1px solid var(--line);
    padding:24px;
    border-radius:6px;
    width:100%;
    max-width:380px;
    box-shadow:0 8px 24px rgba(22,35,31,0.15);
  }

  .auth-card h2{
    margin-top:0;
    font-size:20px;
    color:var(--teal-dark);
    font-family:var(--serif);
  }

  .auth-card label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:12px 0 4px 0;
  }

  .auth-card input{
    width:100%;
    padding:8px 10px;
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:3px;
    font-size:14px;
  }

  .auth-card input:focus{
    outline:none;
    border-color:var(--teal);
  }

  .auth-card button{
    width:100%;
    padding:10px;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:3px;
    font-weight:700;
    cursor:pointer;
    margin-top:14px;
    font-size:14px;
  }

  .auth-card button:hover{
    background:var(--teal-dark);
  }

  .auth-switch{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:14px;
    cursor:pointer;
  }

  .auth-switch:hover{
    color:var(--teal-dark);
    text-decoration:underline;
  }

  /* App Principal */
  #appContainer{
    display:none;
    flex-direction:column;
    min-height:100vh;
  }

  header.masthead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
    background:var(--paper-2);
    border-bottom:2px solid var(--ink);
    flex-wrap:wrap;
    gap:10px;
  }

  header.masthead h1{
    font-size:20px;
    margin:0;
    font-family:var(--serif);
    color:var(--ink);
  }

  header.masthead .user-info{
    font-size:12px;
    color:var(--muted);
  }

  header.masthead .actions-top{
    display:flex;
    gap:8px;
    align-items:center;
  }

  button.btn-sm{
    background:#fff;
    color:var(--ink);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:3px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
  }

  button.btn-sm:hover{
    background:var(--paper);
    border-color:var(--teal);
  }

  button.btn-danger{
    background:#fbecea;
    color:var(--flame);
    border-color:var(--flame);
  }

  /* Barra de Control Rápido Horizontal */
  .quick-bar{
    background:var(--paper-2);
    padding:10px 24px;
    border-bottom:1px solid var(--line);
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
  }

  .control-group{
    display:flex;
    flex-direction:column;
    gap:3px;
    flex:1;
    min-width:140px;
  }

  .control-group label{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .control-group select,
  .control-group input[type="text"],
  .control-group input[type="number"]{
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    padding:6px 8px;
    border-radius:3px;
    font-size:13px;
    width:100%;
  }

  .control-group select:focus,
  input:focus{
    outline:none;
    border-color:var(--teal);
  }

  .checkbox-group{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:4px;
  }

  .checkbox-group input{
    width:14px;
    height:14px;
    accent-color:var(--teal);
    cursor:pointer;
  }

  .checkbox-group label{
    font-size:12px;
    color:var(--ink);
    cursor:pointer;
  }

  /* Layout Principal */
  .workspace{
    display:grid;
    grid-template-columns:minmax(390px, 430px) minmax(0,1fr);
    flex:1;
    min-height:calc(100vh - 120px);
    background:var(--paper);
  }

  aside.sidebar{
    width:auto;
    background:var(--paper-2);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    height:calc(100vh - 120px);
    position:relative;
    z-index:5;
  }

  .sidebar-header{
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    background:rgba(244,245,239,.96);
  }

  .view-tabs{display:flex;gap:4px;}

  .view-tabs button{
    background:#fff;
    border:1px solid var(--line);
    color:var(--muted);
    padding:6px 13px;
    border-radius:5px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
  }

  .view-tabs button.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }

  .feed-list{
    flex:1;
    overflow-y:auto;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  #map-container{
    flex:1;
    position:relative;
    background:#dbe6e2;
    min-width:0;
  }

  #map{width:100%;height:100%;min-height:400px;}

  /* Tarjetas de Avistamiento */
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-left:5px solid var(--moss);
    border-radius:10px;
    padding:0;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(22,35,31,.07);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }

  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 20px rgba(22,35,31,.12);
    border-color:var(--teal);
  }

  .card.notable{border-left-color:var(--flame);}
  .card.unconfirmed{border-left-color:var(--amber);}

  .card-top{display:block;}

  .card-thumb{
    width:100%;
    height:175px;
    border:0;
    border-radius:0;
    background:linear-gradient(135deg,#dfe8e3,#f4f5ef);
    overflow:hidden;
    position:relative;
  }

  .card-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .card-thumb.empty::after{
    content:'🐦';
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    font-size:54px;
    opacity:.28;
  }

  .card-info{padding:12px 14px 4px;min-width:0;}

  .photo-source{
    font-size:9px;
    color:rgba(255,255,255,.85);
    position:absolute;
    right:8px;
    bottom:7px;
    margin:0;
    padding:3px 6px;
    border-radius:10px;
    background:rgba(22,35,31,.62);
    line-height:1;
    text-align:center;
  }

  .card-title{
    font-size:20px;
    font-weight:700;
    margin:0 0 2px 0;
    font-family:var(--serif);
    color:var(--ink);
    line-height:1.15;
  }

  .card-sci{
    font-size:12px;
    color:var(--muted);
    font-style:italic;
    margin:0 0 8px;
  }

  .badge{
    display:inline-block;
    font-size:9px;
    padding:3px 7px;
    border-radius:10px;
    font-weight:700;
    margin-left:5px;
    vertical-align:middle;
    font-family:var(--sans);
  }

  .badge.new{background:var(--flame);color:#fff;}
  .badge.notable{background:var(--moss);color:#fff;}
  .badge.unconfirmed{background:var(--amber);color:#fff;}

  .card-meta{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
  }

  .card-comment{
    font-size:11.5px;
    background:var(--paper-2);
    padding:7px 10px;
    border-radius:6px;
    border-left:2px solid var(--line);
    color:var(--ink);
    margin:7px 14px 0;
  }

  .card-actions{
    display:grid;
    grid-template-columns:1.1fr 1fr 1fr;
    gap:7px;
    padding:11px 14px 14px;
    margin:0;
  }

  .card-actions a{
    text-align:center;
    background:var(--paper-2);
    color:var(--ink);
    text-decoration:none;
    padding:7px 5px;
    border-radius:6px;
    font-size:11.5px;
    font-weight:700;
    border:1px solid var(--line);
  }

  .card-actions a.wa{background:var(--teal);color:#fff;border-color:var(--teal);}
  .card-actions a.wa:hover{background:var(--teal-dark);}
  .card-actions a:hover{background:#fff;border-color:var(--teal);}

  .status-text{
    font-size:11.5px;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    text-align:right;
  }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--muted);
    font-size:13px;
  }

  @media (max-width:850px){
    .workspace{display:flex;flex-direction:column;}
    aside.sidebar{width:100%;height:58vh;position:relative;}
    #map-container{height:42vh;min-height:320px;}
    .card-thumb{height:155px;}
    header.masthead{padding:12px 16px;}
    .quick-bar{padding:10px 16px;}
  }
</style>
</head>

<body>

<!-- Login -->
<div id="authScreen">
  <div class="auth-card">
    <h2 id="authTitle">Acceso a Bitácora</h2>

    <div id="authError" style="color:var(--flame);font-size:12px;margin-bottom:8px;"></div>

    <label>Correo electrónico</label>
    <input type="email" id="authEmail" placeholder="usuario@correo.com">

    <label>Contraseña</label>
    <input type="password" id="authPassword" placeholder="••••••••">

    <button id="authBtn">Ingresar</button>

    <div class="auth-switch" id="authSwitchMode">
      ¿No tienes cuenta? Regístrate
    </div>
  </div>
</div>


<!-- Aplicación Principal -->
<div id="appContainer">

  <header class="masthead">
    <div>
      <h1>🐦 Bitácora eBird · Chile</h1>

      <div class="user-info">
        Conectado como:
        <span id="userEmailSpan" style="color:var(--teal-dark);font-weight:600;"></span>
      </div>
    </div>

    <div class="actions-top">

      <div class="status-text">
        <span id="lastUpdate">Sin datos</span>
        <span id="nextUpdate" style="font-size:10px;"></span>
      </div>

      <button class="btn-sm" id="btnRefresh">
        Actualizar
      </button>

      <button class="btn-sm btn-danger" id="btnLogout">
        Salir
      </button>

    </div>
  </header>


  <!-- Barra de Control -->
  <div class="quick-bar">

    <div class="control-group" style="max-width:180px;">
      <label>Zona</label>

      <select id="region">
        <option value="CL">Todo Chile</option>
        <option value="CL-AP">Arica y Parinacota</option>
        <option value="CL-TA">Tarapacá</option>
        <option value="CL-AN">Antofagasta</option>
        <option value="CL-AT">Atacama</option>
        <option value="CL-CO">Coquimbo</option>
        <option value="CL-VS">Valparaíso</option>
        <option value="CL-RM">Metropolitana</option>
        <option value="CL-LI">O'Higgins</option>
        <option value="CL-ML">Maule</option>
        <option value="CL-NB">Ñuble</option>
        <option value="CL-BI">Biobío</option>
        <option value="CL-AR">Araucanía</option>
        <option value="CL-LR">Los Ríos</option>
        <option value="CL-LL">Los Lagos</option>
        <option value="CL-AI">Aysén</option>
        <option value="CL-MA">Magallanes</option>
      </select>
    </div>


    <div class="control-group" style="max-width:150px;">
      <label>Filtro</label>

      <select id="mode">
        <option value="notable">Solo especies raras</option>
        <option value="all">Todas las especies</option>
      </select>
    </div>


    <div class="control-group" style="max-width:80px;">
      <label>Últimos días</label>

      <input
        type="number"
        id="backDays"
        min="1"
        max="14"
        value="2"
      >
    </div>


    <div class="control-group" style="max-width:130px;">
      <label>Nombre mostrado</label>

      <select id="nameLocale">
        <option value="es">Español (Chile)</option>
        <option value="es">Español</option>
        <option value="en">Inglés</option>
        <option value="sci">Científico</option>
      </select>
    </div>


    <div class="control-group" style="flex:2;min-width:200px;">
      <label>Lista de especies CSV (vitalicia)</label>

      <input
        type="file"
        id="lifeListFile"
        accept=".csv"
        style="font-size:11.5px;padding:3px;"
      >
    </div>


    <div class="control-group" style="max-width:150px;">
      <label>WhatsApp de amigo</label>

      <input
        type="text"
        id="friendPhone"
        placeholder="56912345678"
      >
    </div>


    <div style="display:flex;flex-direction:column;gap:4px;">

      <div class="checkbox-group">
        <input type="checkbox" id="hideSeenToggle">
        <label for="hideSeenToggle">Ocultar especies vistas</label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="includeProvisional">
        <label for="includeProvisional">Incluir registros en revisión</label>
      </div>

    </div>


    <button
      class="btn-sm"
      id="btnSave"
      style="background:var(--teal);color:#fff;font-weight:700;padding:7px 14px;margin-top:auto;border:none;"
    >
      Aplicar
    </button>

  </div>


  <!-- Workspace -->
  <div class="workspace">

    <aside class="sidebar">

      <div class="sidebar-header">

        <span
          id="lifeStatus"
          style="font-size:11.5px;color:var(--muted);"
        >
          Cargando lista...
        </span>

        <div class="view-tabs">

          <button id="tabFeed" class="active">
            Lista
          </button>

          <button id="tabMapToggle">
            Mapa
          </button>

        </div>

      </div>

      <div id="feed" class="feed-list"></div>

    </aside>


    <div id="map-container">
      <div id="map"></div>
    </div>

  </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  /* =========================================================
     FIREBASE
     ========================================================= */

  const firebaseConfig = {
    apiKey: "AIzaSyBRs59_2hhEyyFGuZ6jn2XgQS1Ve74AWrg",
    authDomain: "ebird-c1352.firebaseapp.com",
    projectId: "ebird-c1352",
    storageBucket: "ebird-c1352.firebasestorage.app",
    messagingSenderId: "119395490083",
    appId: "1:119395490083:web:3ecf01bef253ed56cf5496",
    measurementId: "G-ECNHD7DLH4"
  };


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);


  const EMBEDDED_API_KEY =
    '89f4bf7f-47ac-4e68-949f-de69c890bce7';


  let currentUser = null;


  /* =========================================================
     ESTADO
     ========================================================= */

  let cachedState =
    localStorage.getItem('ebird_classic_state');


  let state = cachedState
    ? JSON.parse(cachedState)
    : {
        apiKey: EMBEDDED_API_KEY,
        region:'CL',
        mode:'notable',
        backDays:2,
        interval:10,
        friendPhone:'',
        lifeList:[],
        hideSeen:false,
        nameLocale:'es',
        includeProvisional:false,
        seenSubIds:[],
        imageCache:{}
      };


  /* Compatibilidad con estados anteriores */
  if(state.nameLocale === 'es-CL' || state.nameLocale === 'es_CL') state.nameLocale = 'es';
  if(!state.imageCache){
    state.imageCache = {};
  }


  let map,
      markerLayer;


  let pollTimer = null,
      countdownTimer = null,
      nextRunAt = null;


  let cachedObservations =
    localStorage.getItem('ebird_fast_obs_cache');


  let lastObservations =
    cachedObservations
      ? JSON.parse(cachedObservations)
      : [];


  let isRegistering = false;


  /* =========================================================
     LOGIN
     ========================================================= */

  document
    .getElementById('authSwitchMode')
    .addEventListener('click', () => {

      isRegistering = !isRegistering;

      document.getElementById('authTitle').textContent =
        isRegistering
          ? 'Crear cuenta'
          : 'Acceso a Bitácora';

      document.getElementById('authBtn').textContent =
        isRegistering
          ? 'Registrarse'
          : 'Ingresar';

      document.getElementById('authSwitchMode').textContent =
        isRegistering
          ? '¿Ya tienes cuenta? Ingresa'
          : '¿No tienes cuenta? Regístrate';
    });


  document
    .getElementById('authBtn')
    .addEventListener('click', () => {

      const email =
        document.getElementById('authEmail')
          .value
          .trim();

      const pass =
        document.getElementById('authPassword')
          .value
          .trim();

      const errBox =
        document.getElementById('authError');

      errBox.textContent = '';


      if(!email || !pass){

        errBox.textContent =
          'Completa el correo electrónico y la contraseña.';

        return;
      }


      if(isRegistering){

        createUserWithEmailAndPassword(
          auth,
          email,
          pass
        ).catch(e => {

          errBox.textContent =
            traducirErrorFirebase(e);
        });

      }else{

        signInWithEmailAndPassword(
          auth,
          email,
          pass
        ).catch(e => {

          errBox.textContent =
            traducirErrorFirebase(e);
        });

      }

    });


  function traducirErrorFirebase(error){

    const code = error && error.code
      ? error.code
      : '';

    const mensajes = {

      'auth/invalid-email':
        'El correo electrónico no es válido.',

      'auth/user-not-found':
        'No existe una cuenta con este correo.',

      'auth/wrong-password':
        'La contraseña es incorrecta.',

      'auth/invalid-credential':
        'El correo o la contraseña son incorrectos.',

      'auth/email-already-in-use':
        'Este correo ya está registrado.',

      'auth/weak-password':
        'La contraseña es demasiado débil.',

      'auth/network-request-failed':
        'No hay conexión con el servidor.',

      'auth/too-many-requests':
        'Demasiados intentos. Inténtalo nuevamente más tarde.'
    };


    return mensajes[code] ||
      'No se pudo completar la operación. Inténtalo nuevamente.';
  }


  /* =========================================================
     CERRAR SESIÓN
     ========================================================= */

  document
    .getElementById('btnLogout')
    .addEventListener('click', () => {

      signOut(auth).then(() => {

        localStorage.removeItem(
          'ebird_classic_state'
        );

        localStorage.removeItem(
          'ebird_fast_obs_cache'
        );

        location.reload();

      });

    });


  /* =========================================================
     ESTADO DE AUTENTICACIÓN
     ========================================================= */

  onAuthStateChanged(auth, user => {

    if(user){

      currentUser = user;

      document.getElementById(
        'authScreen'
      ).style.display = 'none';

      document.getElementById(
        'appContainer'
      ).style.display = 'flex';

      document.getElementById(
        'userEmailSpan'
      ).textContent = user.email;


      fillForm();

      renderLifeStatus();

      initMap();


      if(lastObservations.length > 0){

        renderCurrentData();

        document.getElementById(
          'lastUpdate'
        ).textContent =
          'Datos guardados · Actualizando...';
      }


      fetchObservations();


      getDoc(
        doc(db, 'users', currentUser.uid)
      )
      .then(docSnap => {

        if(docSnap.exists()){

          const data = docSnap.data();


          if(data.preferences){

            Object.assign(
              state,
              data.preferences
            );
          }


          if(
            data.lifeList &&
            data.lifeList.length > 0
          ){

            state.lifeList =
              data.lifeList;
          }


          localStorage.setItem(
            'ebird_classic_state',
            JSON.stringify(state)
          );


          fillForm();

          renderLifeStatus();

          renderCurrentData();

        }

      })
      .catch(() => {});


    }else{

      currentUser = null;

      document.getElementById(
        'authScreen'
      ).style.display = 'flex';

      document.getElementById(
        'appContainer'
      ).style.display = 'none';

    }

  });

  /* =========================================================
     CSV
     ========================================================= */

  function parseCSV(text){

    const lines =
      text
        .split(/\r\n|\n|\r/)
        .filter(
          l => l.trim().length
        );


    if(!lines.length) return [];


    const headers =
      splitCSVLine(lines[0])
        .map(
          h => h.trim().toLowerCase()
        );


    const sciIdx =
      headers.findIndex(
        h => h.indexOf('scientific') > -1
      );


    const comIdx =
      headers.findIndex(
        h =>
          h.indexOf('common name') > -1 ||
          h === 'species'
      );


    const seen = {};


    for(
      let i=1;
      i<lines.length;
      i++
    ){

      const cols =
        splitCSVLine(lines[i]);


      const sci =
        sciIdx > -1
          ? (cols[sciIdx] || '')
              .trim()
              .toLowerCase()
          : '';


      const com =
        comIdx > -1
          ? (cols[comIdx] || '')
              .trim()
          : '';


      const key =
        sci ||
        normalizeText(com);


      if(!key) continue;


      if(!seen[key]){

        seen[key] = {
          sci:sci,
          common:normalizeText(com)
        };

      }

    }


    return Object.values(seen);

  }


  function splitCSVLine(line){

    const out = [];

    let cur = '';

    let inQuotes = false;


    for(
      let i=0;
      i<line.length;
      i++
    ){

      const ch = line[i];


      if(ch === '"'){

        inQuotes = !inQuotes;

        continue;
      }


      if(
        ch === ',' &&
        !inQuotes
      ){

        out.push(cur);

        cur='';

        continue;
      }


      cur += ch;

    }


    out.push(cur);

    return out;

  }


  function normalizeText(t){

    return (t || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(
        /[\u0300-\u036f]/g,
        ''
      )
      .trim();

  }


  function isInLifeList(obs){

    if(!state.lifeList.length)
      return false;


    const sci =
      (obs.sciName || '')
        .toLowerCase();


    const com =
      normalizeText(
        obs.comName || ''
      );


    return state.lifeList.some(
      item =>
        (
          item.sci &&
          sci &&
          item.sci === sci
        ) ||
        (
          item.common &&
          com &&
          item.common === com
        )
    );

  }

            obs => {

                isInLifeList(obs);

            }
          );


          renderCurrentData();

        };


        reader.readAsText(file);

      }
    );

  /* =========================================================
     URL EBIRD
     ========================================================= */

  function buildUrl(){

    let base =
      'https://api.ebird.org/v2/data/obs/' +
      encodeURIComponent(
        state.region
      ) +
      '/recent';


    if(state.mode === 'notable'){

      base += '/notable';

    }


    const nameLocale =
      state.nameLocale === 'sci'
        ? 'es-CL'
        : state.nameLocale;


    const params = [
      'back=' + state.backDays,
      'sppLocale=es',
      'detail=full',
      'key=' +
        encodeURIComponent(
          state.apiKey
        )
    ];


    if(state.mode === 'all'){

      params.push(
        'maxResults=300'
      );

    }


    if(state.includeProvisional){

      params.push(
        'includeProvisional=true'
      );

    }


    return (
      base +
      '?' +
      params.join('&')
    );

  }


  /* =========================================================
     WIKIPEDIA
     
     Busca imagen usando principalmente
     el nombre científico del ave.
     ========================================================= */

  async function getWikipediaImage(
    sciName,
    commonName = ''
  ){

    const names = [];


    if(sciName){

      names.push(
        sciName.trim()
      );

    }


    if(commonName){

      names.push(
        commonName.trim()
      );

    }


    for(
      const lang of ['es','en']
    ){

      for(
        const searchName of names
      ){

        try{

          const url =
            `https://${lang}.wikipedia.org/w/api.php` +
            `?action=query` +
            `&generator=search` +
            `&gsrsearch=${encodeURIComponent(searchName)}` +
            `&gsrnamespace=0` +
            `&gsrlimit=5` +
            `&prop=pageimages` +
            `&piprop=thumbnail` +
            `&pithumbsize=500` +
            `&format=json` +
            `&origin=*`;


          const response =
            await fetch(url);


          if(!response.ok)
            continue;


          const data =
            await response.json();


          if(
            !data.query ||
            !data.query.pages
          ){

            continue;

          }


          const pages =
            Object.values(
              data.query.pages
            );


          /*
           * Primero intentamos encontrar
           * coincidencia exacta.
           */

          const exactPage =
            pages.find(
              page =>
                page.thumbnail &&
                page.title &&
                page.title
                  .toLowerCase()
                  === searchName.toLowerCase()
            );


          if(
            exactPage &&
            exactPage.thumbnail
          ){

            return {
              url:
                exactPage.thumbnail.source,

              source:
                'Wikipedia'
            };

          }


          /*
           * Si no hay coincidencia exacta,
           * usamos una página con imagen.
           */

          const pageWithImage =
            pages.find(
              page =>
                page.thumbnail &&
                page.thumbnail.source
            );


          if(
            pageWithImage &&
            pageWithImage.thumbnail
          ){

            return {
              url:
                pageWithImage.thumbnail.source,

              source:
                'Wikipedia'
            };

          }

        }catch(error){

          console.warn(
            'No se pudo obtener imagen de Wikipedia:',
            error
          );

        }

      }

    }


    return {
      url:'',
      source:''
    };

  }


  /* =========================================================
     OBTENER IMAGEN DEL AVE
     
     1. Primero eBird
     2. Después Wikipedia
     3. Después caché
     ========================================================= */

  async function getBirdImage(obs){

    const sci =
      (obs.sciName || '')
        .trim();


    const common =
      (obs.comName || '')
        .trim();


    const cacheKey =
      normalizeText(
        sci || common
      );


    /*
     * Primero revisamos la caché.
     */

    if(
      cacheKey &&
      state.imageCache &&
      state.imageCache[cacheKey]
    ){

      return state.imageCache[cacheKey];

    }


    /*
     * Primero usamos una fotografía
     * entregada por eBird.
     */

    if(
      obs.media &&
      obs.media.length > 0
    ){

      const photo =
        obs.media.find(
          m =>
            m.mediaType === 'photo' &&
            m.url
        );


      if(photo && photo.url){

        const result = {
          url:photo.url,
          source:'eBird'
        };


        if(cacheKey){

          state.imageCache[cacheKey] =
            result;

        }


        return result;

      }

    }


    /*
     * Si eBird no tiene foto,
     * buscamos automáticamente en Wikipedia.
     */

    const wikipediaResult =
      await getWikipediaImage(
        sci,
        common
      );


    if(
      wikipediaResult &&
      wikipediaResult.url
    ){

      if(cacheKey){

        state.imageCache[cacheKey] =
          wikipediaResult;

      }


      return wikipediaResult;

    }


    return {
      url:'',
      source:''
    };

  }


  /* =========================================================
     OBTENER OBSERVACIONES
     ========================================================= */

  function fetchObservations(){

    const directUrl =
      buildUrl();


    if(
      lastObservations.length === 0
    ){

      document.getElementById(
        'lastUpdate'
      ).textContent =
        'Buscando observaciones...';

    }


    fetch(directUrl)

      .then(res => {

        if(!res.ok)
          throw new Error();

        return res.json();

      })

      .then(data => {

        handleNewData(data);

      })

      .catch(() => {

        fetch(
          'https://api.allorigins.win/raw?url=' +
          encodeURIComponent(
            directUrl
          )
        )

        .then(res => res.json())

        .then(data => {

          handleNewData(data);

        })

        .catch(() => {

          if(
            lastObservations.length === 0
          ){

            document.getElementById(
              'lastUpdate'
            ).textContent =
              'Error de conexión.';

          }

        });

      })

      .finally(() => {

        scheduleNext();

      });

  }


  /* =========================================================
     PROCESAR NUEVAS OBSERVACIONES
     ========================================================= */

  async function handleNewData(data){

    const seenSet = {};


    state.seenSubIds.forEach(
      id => {

        seenSet[id] = true;

      }
    );


    /*
     * Procesamos los registros.
     */

    for(
      const obs of data
    ){

      obs._isNew =
        !seenSet[obs.subId];


      obs._inLifeList =
        isInLifeList(obs);


      obs._unconfirmed =
        (
          obs.obsValid === false
        ) ||
        (
          obs.obsReviewed === false
        );


      /*
       * Foto del ave.
       *
       * eBird primero.
       * Wikipedia como alternativa.
       */

      const imageResult =
        await getBirdImage(obs);


      obs._imageUrl =
        imageResult.url || '';


      obs._imageSource =
        imageResult.source || '';


      seenSet[obs.subId] =
        true;

    }


    /*
     * Ordenar desde la observación
     * más reciente a la más antigua.
     */

    data.sort(
      (a,b) =>
        new Date(b.obsDt) -
        new Date(a.obsDt)
    );


    state.seenSubIds =
      Object.keys(seenSet);


    lastObservations =
      data;


    /*
     * Guardar observaciones en caché.
     */

    try{

      localStorage.setItem(
        'ebird_fast_obs_cache',
        JSON.stringify(data)
      );

    }catch(e){}


    /*
     * Guardar caché de imágenes.
     */

    try{

      localStorage.setItem(
        'ebird_image_cache',
        JSON.stringify(
          state.imageCache
        )
      );

    }catch(e){}


    saveUserDataToCloud();


    document.getElementById(
      'lastUpdate'
    ).textContent =
      'Actualizado ' +
      new Date()
        .toLocaleTimeString(
          'es-CL',
          {
            hour:'2-digit',
            minute:'2-digit'
          }
        );


    renderCurrentData();

  }


  /* =========================================================
     RECUPERAR CACHÉ DE IMÁGENES
     ========================================================= */

  try{

    const cachedImages =
      localStorage.getItem(
        'ebird_image_cache'
      );


    if(cachedImages){

      const parsed =
        JSON.parse(
          cachedImages
        );


      if(parsed){

        state.imageCache =
          Object.assign(
            {},
            state.imageCache || {},
            parsed
          );

      }

    }

  }catch(e){}


  /* =========================================================
     ACTUALIZACIÓN AUTOMÁTICA
     ========================================================= */

  function scheduleNext(){

    clearTimeout(
      pollTimer
    );

    clearInterval(
      countdownTimer
    );


    const ms =
      10 * 60 * 1000;


    nextRunAt =
      Date.now() + ms;


    pollTimer =
      setTimeout(
        () => {
          fetchObservations();
        },
        ms
      );


    countdownTimer =
      setInterval(
        updateCountdown,
        1000
      );

  }


  function updateCountdown(){

    const remaining =
      Math.max(
        0,
        Math.round(
          (
            nextRunAt -
            Date.now()
          ) / 1000
        )
      );


    const m =
      Math.floor(
        remaining / 60
      );


    const s =
      remaining % 60;


    document.getElementById(
      'nextUpdate'
    ).textContent =
      'Próxima actualización: ' +
      m +
      ':' +
      (
        s < 10
          ? '0'
          : ''
      ) +
      s;

  }


  /* =========================================================

     ========================================================= */

  function renderCurrentData(){

    let dataToRender =
      lastObservations;


    if(
      state.hideSeen &&
      state.lifeList.length > 0
    ){

      dataToRender =
        lastObservations.filter(
          obs =>
            !obs._inLifeList
        );

    }


    renderMapMarkers(
      dataToRender
    );


    renderFeed(
      dataToRender
    );

  }


  /* =========================================================
     MARCADORES DEL MAPA
     ========================================================= */

  function renderMapMarkers(data){

    if(!markerLayer)
      return;


    markerLayer.clearLayers();


    if(!data.length)
      return;


    const bounds = [];


    data.forEach(
      obs => {

        if(
          typeof obs.lat !== 'number' ||
          typeof obs.lng !== 'number'
        ){

          return;

        }


        const color =
          obs._unconfirmed
            ? '#B8860B'
            : (
                obs._inLifeList === false &&
                state.lifeList.length
                  ? '#C94A3D'
                  : '#1F6F64'
              );


        const marker =
          L.circleMarker(
            [
              obs.lat,
              obs.lng
            ],
            {
              radius:6,
              color:color,
              fillColor:color,
              fillOpacity:0.9,
              weight:1
            }
          );


        marker.bindPopup(
          popupHtml(obs)
        );


        marker.addTo(
          markerLayer
        );


        bounds.push([
          obs.lat,
          obs.lng
        ]);

      }
    );


    if(bounds.length){

      map.fitBounds(
        bounds,
        {
          padding:[20,20],
          maxZoom:11
        }
      );

    }

  }

      );


    const commentText =
      obs.comments ||
      obs.subIDComments ||
      '';


    const msg =
      '🐦 ' +
      nameLine +
      '\n' +

      (
        obs._unconfirmed
          ? '⚠️ Registro en revisión\n'
          : ''
      ) +

      '📍 ' +
      obs.locName +
      '\n' +

      '🕒 ' +
      formatDate(obs.obsDt) +

      (
        obs.howMany
          ? '\n🔢 ' +
            obs.howMany +
            ' ejemplar(es)'
          : ''
      ) +

      '\n👤 ' +
      observer +

      (
        commentText
          ? '\n💬 "' +
            commentText +
            '"'
          : ''
      ) +

      '\n🗺️ https://www.google.com/maps?q=' +
      obs.lat +
      ',' +
      obs.lng +

      '\n📋 https://ebird.org/checklist/' +
      obs.subId;


    return state.friendPhone

      ? 'https://wa.me/' +
        state.friendPhone +
        '?text=' +
        encodeURIComponent(msg)

      : 'https://wa.me/?text=' +
        encodeURIComponent(msg);

  }


  /* =========================================================
     FECHA
     ========================================================= */

  function formatDate(d){

    const dt =
      new Date(
        d.replace(
          ' ',
          'T'
        )
      );


    if(
      isNaN(
        dt.getTime()
      )
    ){

      return d;

    }


    return dt.toLocaleTimeString(
      'es-CL',
      {
        hour:'2-digit',
        minute:'2-digit'
      }
    );

  }


  /* =========================================================
     NOMBRES
     ========================================================= */

  /* =========================================================
     NOMBRES COMUNES DE CHILE
     Se prioriza el nombre usado en Chile cuando conocemos
     el nombre científico. Para especies no incluidas, se usa
     el nombre en español entregado por eBird.
     ========================================================= */

  const CHILE_BIRD_NAMES = {
    'scelorchilus rubecula':'Chucao',
    'asio flammeus':'Nuco',
    'patagioenas araucana':'Torcaza',
    'leistes loyca':'Loica',
    'zonotrichia capensis':'Chincol',
    'milvago chimango':'Tiuque',
    'vanellus chilensis':'Queltehue',
    'vultur gryphus':'Cóndor',
    'campephilus magellanicus':'Carpintero negro',
    'megaceryle torquata':'Martín pescador',
    'columba livia':'Paloma doméstica',
    'molothrus rufoaxillaris':'Tordo de ala rojiza',
    'mimus triurus':'Calandria tres colas',
    'sicalis luteola':'Chirihue',
    'phrygilus gayi':'Cometocino de Gay',
    'phrygilus patagonicus':'Cometocino patagónico',
    'phrygilus fruticeti':'Cometocino de dorso castaño',
    'diuca diuca':'Diuca',
    'troglodytes aedon':'Chercán',
    'turdus falcklandii':'Zorzal',
    'elaenia albiceps':'Fiofío',
    'anairetes parulus':'Cachudito',
    'sephanoides sephaniodes':'Picaflor chico',
    'lesbia sparganurus':'Picaflor gigante',
    'geranoaetus polyosoma':'Aguilucho',
    'caracara plancus':'Traro',
    'falco sparverius':'Cernícalo',
    'falco femoralis':'Halcón perdiguero',
    'buteo ventralis':'Aguilucho de cola rojiza',
    'athene cunicularia':'Pequén',
    'glaucidium nana':'Chuncho',
    'strix rufipes':'Concón',
    'nycticorax nycticorax':'Huairavo',
    'ardea cocoi':'Garza cuca',
    'ardea alba':'Garza grande',
    'egretta thula':'Garza chica',
    'cathartes aura':'Jote de cabeza colorada',
    'coragyps atratus':'Jote de cabeza negra',
    'cureo':'Cureo'
  };

  function chileanCommonName(obs){
    const key = normalizeText(obs.sciName || '');
    if(key && CHILE_BIRD_NAMES[key]) return CHILE_BIRD_NAMES[key];
    return obs.comName || 'Ave sin nombre';
  }

  function primaryName(obs){

    return state.nameLocale === 'sci'

      ? obs.sciName
      : chileanCommonName(obs);

  }


  function secondaryLine(obs){

    return state.nameLocale === 'sci'
      ? chileanCommonName(obs)
      : obs.sciName;

  }


  /* =========================================================
     SEGURIDAD HTML
     ========================================================= */

  function escapeHtml(s){

    return (
      s == null
        ? ''
        : String(s)
    )
    .replace(
      /[&<>"']/g,
      c =>
        ({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'
        }[c])
    );

  }


  /* =========================================================
     PESTAÑAS LISTA / MAPA
     ========================================================= */

  document
    .getElementById('tabFeed')
    .addEventListener(
      'click',
      () => {

        document
          .getElementById('tabFeed')
          .classList.add('active');


        document
          .getElementById('tabMapToggle')
          .classList.remove('active');


        document
          .querySelector('.sidebar')
          .style.display = 'flex';


        document
          .getElementById('map-container')
          .style.display = 'none';

      }
    );


  document
    .getElementById('tabMapToggle')
    .addEventListener(
      'click',
      () => {

        document
          .getElementById('tabMapToggle')
          .classList.add('active');


        document
          .getElementById('tabFeed')
          .classList.remove('active');


        if(window.innerWidth <= 850){

          document
            .querySelector('.sidebar')
            .style.display = 'none';


          document
            .getElementById('map-container')
            .style.display = 'block';

        }


        if(map){

          map.invalidateSize();

        }

      }
    );


  /* =========================================================
     BOTÓN ACTUALIZAR
     ========================================================= */

  document
    .getElementById('btnRefresh')
    .addEventListener(
      'click',
      () => {

        fetchObservations();

      }
    );


  /* =========================================================
     BOTÓN APLICAR
     ========================================================= */

  document
    .getElementById('btnSave')
    .addEventListener(
      'click',
      () => {

        readForm();

        fetchObservations();

      }
    );


  /* =========================================================
     VISTA INICIAL EN MÓVIL
     ========================================================= */

  if(window.innerWidth <= 850){

    document
      .getElementById('map-container')
      .style.display = 'none';

  }

</script>
